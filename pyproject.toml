[project]
name = "emr-summarizer"
version = "0.1.0"
description = "RAG pipeline that turns raw EMRs into actionable summaries (DTU / CCDR-Koshika)"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
